<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F4EA"/>
      <stop offset="100%" stop-color="#EAE3D2"/>
    </linearGradient>
    <linearGradient id="coffeeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D7A97A"/>
      <stop offset="40%" stop-color="#8B5A2B"/>
      <stop offset="100%" stop-color="#4A2810"/>
    </linearGradient>
    <linearGradient id="frothGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2E6D8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bgGrad)"/>
  <ellipse cx="300" cy="380" rx="140" ry="24" fill="#D8CFBF" opacity="0.6"/>
  
  <!-- Glass jar outline -->
  <path d="M230 140 L240 360 C242 375, 358 375, 360 360 L370 140 Z" fill="#E8EEF0" opacity="0.35" stroke="#BFD3DC" stroke-width="3"/>
  
  <!-- Coffee Liquid -->
  <path d="M236 170 L242 355 C244 368, 356 368, 358 355 L364 170 C330 180, 270 160, 236 170 Z" fill="url(#coffeeGrad)"/>
  
  <!-- Ice cubes -->
  <rect x="260" y="220" width="38" height="38" rx="6" fill="#FFFFFF" opacity="0.35" transform="rotate(12 279 239)"/>
  <rect x="295" y="270" width="42" height="40" rx="6" fill="#FFFFFF" opacity="0.25" transform="rotate(-15 316 290)"/>
  
  <!-- Thick Froth / Cream layer -->
  <path d="M233 165 C240 145, 270 135, 300 135 C330 135, 360 145, 367 165 C345 175, 310 168, 300 172 C290 168, 255 175, 233 165 Z" fill="url(#frothGrad)"/>
  <circle cx="280" cy="145" r="14" fill="#FFFFFF"/>
  <circle cx="315" cy="142" r="16" fill="#FFFFFF"/>
  <circle cx="300" cy="138" r="18" fill="#FFF8F0"/>
  
  <!-- Chocolate Drizzle -->
  <path d="M260 148 Q280 158 300 146 T340 152" fill="none" stroke="#4A2810" stroke-width="4" stroke-linecap="round"/>
  <path d="M275 140 Q295 150 315 138 T330 144" fill="none" stroke="#4A2810" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Straw -->
  <line x1="335" y1="70" x2="295" y2="330" stroke="#437055" stroke-width="10" stroke-linecap="round"/>
  <line x1="335" y1="70" x2="295" y2="330" stroke="#7DA27E" stroke-width="4" stroke-dasharray="12 12"/>
  
  <!-- Glass reflection highlight -->
  <path d="M246 175 L252 350" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Badge/Tag -->
  <rect x="20" y="20" width="130" height="36" rx="18" fill="#2E5A36" opacity="0.9"/>
  <text x="85" y="43" fill="#FAF7F0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" text-anchor="middle">⚡ FRESH BREW</text>
</svg>
