<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="snackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5EB"/>
      <stop offset="100%" stop-color="#EBE2CF"/>
    </linearGradient>
    <linearGradient id="packGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E25822"/>
      <stop offset="60%" stop-color="#C23616"/>
      <stop offset="100%" stop-color="#8F1D0A"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#snackBg)"/>
  
  <ellipse cx="300" cy="390" rx="150" ry="25" fill="#D5CBBB" opacity="0.6"/>
  
  <!-- Crisps pouch / Bag -->
  <path d="M220 130 C230 110, 370 110, 380 130 L395 340 C395 365, 205 365, 205 340 Z" fill="url(#packGrad)"/>
  
  <!-- Crimped edges top & bottom -->
  <path d="M218 128 L382 128 L380 118 L220 118 Z" fill="#8F1D0A"/>
  <path d="M205 340 L395 340 L392 355 L208 355 Z" fill="#8F1D0A"/>
  
  <!-- Foil shine / highlights -->
  <path d="M245 130 Q260 230 255 335" stroke="#FFA07A" stroke-width="8" fill="none" opacity="0.6" stroke-linecap="round"/>
  
  <!-- Graphics on pack -->
  <circle cx="300" cy="230" r="45" fill="#FED330"/>
  <circle cx="300" cy="230" r="38" fill="#FFF275"/>
  <text x="300" y="225" fill="#C23616" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="16" text-anchor="middle">CHILLI</text>
  <text x="300" y="244" fill="#C23616" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="13" text-anchor="middle">MUNCHIES</text>

  <!-- Floating Crunchy chips around -->
  <ellipse cx="170" cy="240" rx="22" ry="14" fill="#F7B731" transform="rotate(-25 170 240)"/>
  <ellipse cx="430" cy="260" rx="24" ry="16" fill="#FA8231" transform="rotate(35 430 260)"/>
  <ellipse cx="410" cy="180" rx="18" ry="12" fill="#F7B731" transform="rotate(-15 410 180)"/>

  <rect x="20" y="20" width="160" height="36" rx="18" fill="#C23616" opacity="0.9"/>
  <text x="100" y="43" fill="#FAF7F0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" text-anchor="middle">🔥 SPICY STASH</text>
</svg>
